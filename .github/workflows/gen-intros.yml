name: Generate town intros

on:
  schedule:
    - cron: "17 3 * * *"   # daily, early morning UTC
  workflow_dispatch:
    inputs:
      batch:
        description: "Towns to generate this run"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: gen-intros
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate missing intros
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH: ${{ github.event.inputs.batch || '20' }}
        run: node tools/gen-intros.mjs --batch "$BATCH"

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/intros.json; then
            echo "No new intros."
            exit 0
          fi
          git config user.name "intros-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intros.json
          git commit -m "Add town intros"
          git push
